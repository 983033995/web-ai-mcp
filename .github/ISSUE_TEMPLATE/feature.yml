name: Feature request / 功能建议
description: 描述具体需求、能力证据和可验收的完成条件。
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        当前 MVP 仅实现 DeepSeek Web。新网站、搜索和远程 transport 需要独立评估，不代表已支持。
        请勿建议绕过 CAPTCHA、WAF、限流或轮换账号规避限制。
  - type: textarea
    id: need
    attributes:
      label: 用户需求
      description: 描述实际场景及当前受阻之处。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望的 MCP 行为
      description: 提供具体的工具调用与结果示例，使用虚构数据。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 上游能力与使用权限的证据
      description: 附公开文档或可复现观察；不确定时请写明，不提供凭据或私有响应。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 完成标准与范围
      description: 列出验收条件、数据流和权限影响；说明是否仅做调研。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已检索已有 Issue，且未将尚未验证的能力描述为已支持。
          required: true
        - label: 建议不包含凭据或私有数据，不涉及规避网站访问限制。
          required: true

