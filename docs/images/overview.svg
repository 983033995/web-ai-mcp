<text x="496" y="310" font-family="Trebuchet MS, sans-serif" font-size="17" font-weight="700" fill="#8ed9c0">02 / LOCAL SERVER</text>
<text x="496" y="356" font-family="Trebuchet MS, sans-serif" font-size="32" font-weight="700" fill="#f6f2e6">Web AI MCP</text>
<text x="496" y="399" font-family="Trebuchet MS, sans-serif" font-size="21" font-weight="400" fill="#d3e0dc">6 tools · session persistence</text>
<text x="496" y="429" font-family="Trebuchet MS, sans-serif" font-size="20" font-weight="400" fill="#a6c2bc">Chat · thinking · files</text>
