<text x="904" y="356" font-family="Trebuchet MS, sans-serif" font-size="32" font-weight="700" fill="#f6f2e6">DeepSeek Web</text>
<text x="904" y="399" font-family="Trebuchet MS, sans-serif" font-size="21" font-weight="400" fill="#d3e0dc">Own-account web access</text>
<text x="904" y="429" font-family="Trebuchet MS, sans-serif" font-size="20" font-weight="400" fill="#a6c2bc">Private website interface</text>
