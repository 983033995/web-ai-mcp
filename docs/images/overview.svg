<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Web AI MCP architecture</title>
<desc id="desc">A local MCP client calls Web AI MCP over stdio. The server connects to your own DeepSeek web account. Session lineage is stored locally; messages and allowlisted files are sent to DeepSeek.</desc>
<rect width="1280" height="640" fill="#102b2d"/>
<text x="64" y="60" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700" fill="#8ed9c0">YOUR ACCOUNT. YOUR CONVERSATION.</text>
<rect x="994" y="32" width="222" height="42" rx="21" fill="#1d4042" stroke="#396164"/>
<text x="1019" y="60" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="700" fill="#e6efeb">STDIO  /  v0.1.0</text>
<text x="60" y="164" font-family="Georgia, serif" font-size="88" font-weight="700" fill="#f6f2e6">Web AI MCP</text>
<text x="64" y="216" font-family="Trebuchet MS, sans-serif" font-size="27" font-weight="400" fill="#c6d9d5">Consult. Think. Continue — inside your coding workflow.</text>
<rect x="64" y="272" width="336" height="180" rx="16" fill="#1a383a" stroke="#416365"/>
