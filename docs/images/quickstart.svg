<path d="M 448 363 L 456 370" stroke="#2b7163" stroke-width="2" fill="none"/>
<path d="M 448 377 L 456 370" stroke="#2b7163" stroke-width="2" fill="none"/>
<path d="M 824 370 L 864 370" stroke="#2b7163" stroke-width="2" fill="none"/>
<path d="M 856 363 L 864 370" stroke="#2b7163" stroke-width="2" fill="none"/>
<path d="M 856 377 L 864 370" stroke="#2b7163" stroke-width="2" fill="none"/>
<text x="64" y="571" font-family="Trebuchet MS, sans-serif" font-size="23" font-weight="400" fill="#54716b">File analysis is opt-in: set WEB_AI_ALLOWED_ROOTS before uploading.</text>
